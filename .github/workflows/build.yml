name: Validate
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  required-check:
    # Preserve the status name required by the existing main branch policy.
    name: Build and Test
    needs: [backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "$BACKEND_RESULT" = success && test "$FRONTEND_RESULT" = success
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: node --test ../scripts/deployment-result.test.mjs
      - run: npm test -- --detectOpenHandles
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.dearblueno.net
